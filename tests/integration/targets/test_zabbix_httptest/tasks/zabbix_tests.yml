---

- name: test - create new Zabbix httptest on host with many options set
  community.zabbix.zabbix_httptest:
    name: ExampleTest
    host_name: ExampleHost
    params:
      steps:
        - name: Test
          url: https://example.com
          status_codes: [200]
      interval: 1h
      enabled: true
    state: present
  register: zbx_host_httptest_created

- name: assert that httptest was created
  ansible.builtin.assert:
    that: zbx_host_httptest_created is changed

- name: test - create same Zabbix httptest once again
  community.zabbix.zabbix_httptest:
    name: ExampleTest
    host_name: ExampleHost
    params:
      steps:
        - name: Test
          url: https://example.com
          status_codes: [200]
      interval: 1h
      enabled: true
    state: present
  register: zbx_host_httptest_existing

- name: assert that nothing has been changed
  ansible.builtin.assert:
    that: not zbx_host_httptest_existing is changed

- name: test - update existing zabbix httptest
  community.zabbix.zabbix_httptest:
    name: ExampleTest
    host_name: ExampleHost
    params:
      interval: 2h
    state: present
  register: zbx_host_httptest_changed

- name: expect to succeed and that things changed
  ansible.builtin.assert:
    that: zbx_host_httptest_changed is changed

- name: test - rename existing zabbix httptest
  community.zabbix.zabbix_httptest:
    name: ExampleTest
    host_name: ExampleHost
    params:
      new_name: NewExampleTest
    state: present
  register: zbx_host_httptest_renamed

- name: expect to succeed and that things changed
  ansible.builtin.assert:
    that: zbx_host_httptest_renamed is changed

- name: test - rename existing zabbix httptest again
  community.zabbix.zabbix_httptest:
    name: ExampleTest
    host_name: ExampleHost
    params:
      new_name: NewExampleTest
    state: present
  register: zbx_host_httptest_rename_again

- name: assert that nothing has been changed
  ansible.builtin.assert:
    that: not zbx_host_httptest_rename_again is changed

- name: test - rename non-existing zabbix httptest
  community.zabbix.zabbix_httptest:
    name: ExampleTest
    host_name: ExampleHost
    params:
      new_name: NewExampleTest2
    state: present
  ignore_errors: true
  register: zbx_host_httptest_rename_failed

- name: expect to fail
  ansible.builtin.assert:
    that: zbx_host_httptest_rename_failed is failed

- name: test - attempt to delete previously created zabbix httptest
  community.zabbix.zabbix_httptest:
    name: NewExampleTest
    host_name: ExampleHost
    state: absent
  register: zbx_host_httptest_delete

- name: assert that httptest was deleted
  ansible.builtin.assert:
    that: zbx_host_httptest_delete is changed

- name: test - attempt to delete non-existing zabbix httptest
  community.zabbix.zabbix_httptest:
    name: NewExampleTest
    host_name: ExampleHost
    state: absent
  register: zbx_host_httptest_missing_delete

- name: assert that nothing has been changed
  ansible.builtin.assert:
    that: not zbx_host_httptest_missing_delete is changed

- name: test - create new Zabbix httptest on template with many options set
  community.zabbix.zabbix_httptest:
    name: Test
    template_name: ExampleTemplate
    params:
      steps:
        - name: Test
          url: https://example.com
          status_codes: [200]
      interval: 1h
      enabled: true
    state: present
  register: zbxtemprule_new

- name: assert that httptest was created
  ansible.builtin.assert:
    that: zbxtemprule_new is changed

- name: test - create same Zabbix httptest once again
  community.zabbix.zabbix_httptest:
    name: Test
    template_name: ExampleTemplate
    params:
      steps:
        - name: Test
          url: https://example.com
          status_codes: [200]
      interval: 1h
      enabled: true
    state: present
  register: zbxtemprule_existing
  when: false

- name: assert that nothing has been changed
  ansible.builtin.assert:
    that: not zbxtemprule_existing is changed
  when: false

- name: test - update existing zabbix httptest
  community.zabbix.zabbix_httptest:
    name: Test
    template_name: ExampleTemplate
    params:
      interval: 2h
    state: present
  register: zbxtemprule_changed
  when: false

- name: expect to succeed and that things changed
  ansible.builtin.assert:
    that: zbxtemprule_changed is changed
  when: false

- name: test - rename existing zabbix httptest
  community.zabbix.zabbix_httptest:
    name: Test
    template_name: ExampleTemplate
    params:
      new_name: NewTest
    state: present
  register: zbxnamerule_changed
  when: false

- name: expect to succeed and that things changed
  ansible.builtin.assert:
    that: zbxnamerule_changed is changed
  when: false

- name: test - rename existing zabbix httptest again
  community.zabbix.zabbix_httptest:
    name: Test
    template_name: ExampleTemplate
    params:
      new_name: NewTest
    state: present
  register: zbxnamerule_existing
  when: false

- name: assert that nothing has been changed
  ansible.builtin.assert:
    that: not zbxnamerule_existing is changed
  when: false

- name: test - rename non-existing zabbix httptest
  community.zabbix.zabbix_httptest:
    name: Test
    template_name: ExampleTemplate
    params:
      new_name: NewTest2
    state: present
  ignore_errors: true
  register: zbxnamerule_failed
  when: false

- name: expect to fail
  ansible.builtin.assert:
    that: zbxnamerule_failed is failed
  when: false

- name: test - attempt to delete previously created zabbix httptest
  community.zabbix.zabbix_httptest:
    name: NewTest
    template_name: ExampleTemplate
    state: absent
  register: zbxtemprule_existing_delete

- name: assert that trigger was deleted
  ansible.builtin.assert:
    that: zbxtemprule_existing_delete is changed

- name: test - attempt to delete non-existing zabbix httptest
  community.zabbix.zabbix_httptest:
    name: NewTest
    template_name: ExampleTemplate
    state: absent
  register: zbxtemprule_missing_delete

- name: assert that nothing has been changed
  ansible.builtin.assert:
    that: not zbxtemprule_missing_delete is changed
